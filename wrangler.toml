name = "smart-grocery-ai"
main = "src/index.ts"
compatibility_date = "2024-12-18"

# Wird von `wrangler deploy` automatisch vor dem Bundling ausgefuehrt (auch in Cloudflare Workers Builds):
# Abhaengigkeiten installieren und das Frontend nach web/dist bauen.
[build]
command = "npm install && npm run build:web"

# Frontend (Vite-Build) wird als Static Assets vom selben Worker ausgeliefert.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "smart-grocery"
# Nach `wrangler d1 create smart-grocery` hier die ausgegebene ID eintragen.
database_id = "691e9133-7ad3-4fe9-ab95-fff2fed42acc"
migrations_dir = "migrations"

# Workers AI (Free-Tier) fuer Zutat -> Produkt-Matching.
[ai]
binding = "AI"

# Angebote taeglich aktualisieren, in 3 Chunks (Workers-Free-Subrequest-Limit): 04:30 / 04:35 / 04:40 UTC.
[triggers]
crons = ["30 4 * * *", "35 4 * * *", "40 4 * * *"]

[vars]
COOKIDOO_COUNTRY = "at"
OFFERS_ZIP = "4600"          # PLZ fuer regionale Angebote (Wels) - anpassbar
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# Secrets (nicht hier eintragen!):
#   wrangler secret put SESSION_KEY      # 32+ Zeichen, verschluesselt Cookidoo-Cookies
